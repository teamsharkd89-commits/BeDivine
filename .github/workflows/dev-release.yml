# Build the fast dev APK (release build type: R8 + baseline profile, signed
# with the debug keystore so it installs over the previous BeDivine Dev) and
# publish it as a GitHub release, the way DivineDeck does.
#
# Why this exists: uploads to a GitHub release cannot be done from this VM
# (uploads.github.com rejects the PAT surrogate with 401), so the release and
# the asset upload have to happen here, inside Actions, with GITHUB_TOKEN.
# Dispatch it manually after a green Check run: one dispatch = one release
# tagged dev-<run number> with the arm64 + universal APKs attached.
#
# The APKs are signed with the persistent debug keystore from the
# DEBUG_KEYSTORE_BASE64 secret (same key the Check workflow uses), so each new
# release installs over the previous one instead of conflicting.
name: Dev release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      # Persistent debug key, so this APK installs over the previous dev
      # builds. Forks get no secrets; AGP then makes a throwaway key itself.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Build the fast dev APK (release + R8)
        run: ./gradlew assembleDevRelease -PbedivineDevRelease

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/dev/release/app-dev-arm64-v8a-release.apk release/BeDivine-dev-release-arm64.apk
          cp app/build/outputs/apk/dev/release/app-dev-universal-release.apk release/BeDivine-dev-release-universal.apk
          (cd release && sha256sum BeDivine-dev-release-*.apk > SHA256SUMS.txt)
          ls -lh release/

      - name: Publish release with the APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: BeDivine dev (build ${{ github.run_number }})
          body: |
            APK de BeDivine, compilado en GitHub Actions desde ${{ github.sha }}.

            Build release (optimizado con R8, con el perfil de arranque): más
            rápido y más fluido que el debug. No cambia nada visual.

            Instala **BeDivine-dev-release-arm64.apk** en tu teléfono (Redmi Note 10S).
            La universal sirve para cualquier otro teléfono.

            Se instala como "BeDivine Dev", una app aparte, y cada release nueva se
            instala encima de la anterior sin desinstalar.
          files: |
            release/BeDivine-dev-release-arm64.apk
            release/BeDivine-dev-release-universal.apk
            release/SHA256SUMS.txt
          prerelease: true
